<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Matador Pen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">MATADOR</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="search-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Questions, orders, or support — we'd love to hear from you.</p>
        </div>
    </header>

    <main class="container contact">
        <div class="contact-grid">
            <div class="map" aria-hidden="false">
                <!-- Embedded map (replace src with your location if needed) -->
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019880874036!2d-122.41941518468173!3d37.77492977975959!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808c7b1e8f13%3A0x1b0c6c0a0d9e6f0a!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1707897600000!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="contact-form-wrapper">
                <form class="contact-form" id="contactForm">
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <input type="text" name="subject" placeholder="Subject" required>
                    <textarea name="message" placeholder="Your Message" rows="6" required></textarea>
                    <button type="submit" class="submit-button">Send Message</button>
                </form>
                <div id="formMessage" style="display:none; margin-top:10px; padding:10px; border-radius:5px; text-align:center;"></div>
            </div>
            
            <script>
                document.getElementById('contactForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    const form = e.target;
                    const formData = {
                        name: form.querySelector('input[name="name"]').value,
                        email: form.querySelector('input[name="email"]').value,
                        subject: form.querySelector('input[name="subject"]').value,
                        message: form.querySelector('textarea[name="message"]').value
                    };
                    
                    fetch('https://script.google.com/macros/d/AKfycbzp6G-FEZntiN9UQyE_ilIgU4pqX_z9g2GF9zNM0xfuJl_-Uf0aWXPKsWeCAiBHoLYPrQ/userweb/do', {
                        method: 'POST',
                        body: JSON.stringify(formData)
                    })
                    .then(response => {
                        const messageDiv = document.getElementById('formMessage');
                        messageDiv.style.display = 'block';
                        messageDiv.style.backgroundColor = '#d4edda';
                        messageDiv.style.color = '#155724';
                        messageDiv.textContent = 'Thank you! Your message has been sent successfully.';
                        form.reset();
                        setTimeout(() => {
                            messageDiv.style.display = 'none';
                        }, 5000);
                    })
                    .catch(error => {
                        const messageDiv = document.getElementById('formMessage');
                        messageDiv.style.display = 'block';
                        messageDiv.style.backgroundColor = '#f8d7da';
                        messageDiv.style.color = '#721c24';
                        messageDiv.textContent = 'Error sending message. Please try again.';
                    });
                });
            </script>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Matador Pens. All rights reserved.</p>
            <div class="social-links">
                <a href="#">Facebook</a>
                <a href="#">Instagram</a>
                <a href="#">Twitter</a>
            </div>
        </div>
    </footer>
</body>
</html>
